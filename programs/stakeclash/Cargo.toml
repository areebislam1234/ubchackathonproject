[package]
name = "stakeclash"
version = "0.1.0"
description = "StakeClash on-chain program: battles, Gold and Might tokens, stakes and events"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["cdylib", "lib"]
name = "stakeclash"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.31.1", default-features = false, features = ["token"] }
stakeclash-battle = { path = "../battle" }
